# Noctalia config — ubuntu-i3-setup (niri session).
# Bar-only deployment: replaces waybar's 3-pill bar with shaped,
# per-pill blur (ext-background-effect). Everything else stays:
# walker (search + clipboard), fuzzel menus, dunst, swaybg, swaylock,
# swayidle, polkit-gnome agent.
# Deployed to ~/.config/noctalia/config.toml (see install.sh).

[shell]
font_family = "Inter Nerd Font"
setup_wizard_enabled = false # no first-run wizard; this file is the setup
clipboard_enabled = false    # walker owns clipboard history (Mod+V)
polkit_agent = false         # polkit-gnome-authentication-agent-1 stays
telemetry_enabled = false

# Noctalia owns notifications in the niri session; dunst stays for the i3
# session (Noctalia doesn't run on X11).
[notification]
enable_daemon = true

# Floating (not bar-attached) control center and session panel: attached
# panels shape their top edge to merge into the bar, which looks broken
# against our transparent bar.
[shell.panel]
control_center_placement = "floating"
session_placement = "floating"

# Native session panel buttons (opened from the bar's power button).
# Stock defaults minus lock/lock_and_suspend (hidden while noctalia's own
# lockscreen is off — swaylock owns locking here), plus our working Lock
# (swaylock) and Sleep (systemd suspend; swayidle locks on before-sleep).
# Logout/reboot/shutdown are the stock builtins.
[[shell.session.actions]]
action = "command"
label = "Lock"
glyph = "lock"
command = "swaylock -f"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "suspend"
label = "Sleep"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"

# swaylock stays (see niri swayidle spawn).
[lockscreen]
enabled = false

# swaybg stays (see niri swaybg spawn-sh).
[wallpaper]
enabled = false

[bar]
order = ["default"]

# 3-pill bar mirroring config/waybar (left = workspaces + sysmon,
# center = clock, right = status group). Transparent bar surface with
# floating capsule groups; blur follows the pill shapes via
# ext-background-effect (no full-width blur band like forced waybar blur).
[bar.default]
position = "top"
layer = "top"
thickness = 38
reserve_space = true
# Shadow off: the full-width soft drop shadow reads as blur smear in the
# gaps between pills. Re-enable if pills need grounding.
shadow = false
margin_edge = 8
margin_ends = 8
padding = 8
widget_spacing = 6
# No full-width veil: it renders as its own translucent band with visible
# top/bottom edges across the strip. Gaps stay fully transparent.
background_opacity = 0.0
compositor_blur = true
# Custom Noctalia build (branch capsule-blur-region): blur only the pill
# shapes instead of the whole bar strip. Falls back to whole-bar blur on
# stock builds (unknown keys warn, default "bar" applies).
blur_region = "capsules"
radius = 14
color = "#E1E2E6"
font_weight = 700
capsule = false # pills come from the groups below, not per-widget capsules

start = ["group:left", "group:media"]
center = ["group:clockpill"]
end = ["group:status"]

# No middle-click-opens-settings anywhere (waybar has no middle actions).
[bar.default.actions]
middle = "none"

[[bar.default.capsule_group]]
id = "left"
# wallpaper + tray + brightness commented out (too noisy; re-add to restore).
members = ["workspaces", "cpu", "ram"]
fill = "#010B17"
opacity = 0.72
radius = 14
padding = 8

[[bar.default.capsule_group]]
id = "clockpill"
members = ["clock"]
fill = "#010B17"
opacity = 0.72
radius = 14
padding = 8

# Media gets its own pill: visible only while something plays.
[[bar.default.capsule_group]]
id = "media"
members = ["media"]
fill = "#010B17"
opacity = 0.72
radius = 14
padding = 8

[widget.media]
hide_when_no_media = true

[[bar.default.capsule_group]]
id = "status"
# tray + brightness commented out (too noisy; re-add to restore).
members = ["network", "bluetooth", "volume", "battery", "notifications", "session"]
fill = "#010B17"
opacity = 0.72
radius = 14
padding = 8

# App launchers (left pill edges; photos uses the native wallpaper widget,
# music uses the native media widget like the stock bar).

# Waybar parity: cpu% + mem% beside the workspaces.
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"

[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"

# Clock: "Oct 11 - 05:56 PM".
[widget.clock]
format = "{:%b %d - %I:%M %p}"

# Show only workspaces that have windows (plus the active one) instead of
# all 11 niri reports.
[widget.workspaces]
hide_when_empty = true

# Bluetooth: show the connected-device COUNT (empty when zero), like the
# old waybar {num_connections}. (Custom build: show_count option.)
[widget.bluetooth]
show_count = true

# Waybar parity: click toggles mute, scroll steps volume 5%.
[widget.volume.actions]
left = "volume-mute"
scroll_up = "volume-up 5%"
scroll_down = "volume-down 5%"

# Power button (waybar custom/powermenu parity): native session widget,
# opens the floating session panel above. (Ctrl+Alt+Delete still opens
# the fuzzel menu.)
[widget.session]
glyph = "power"
