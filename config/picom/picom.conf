# =========================
# Backend & Performance
# =========================
backend = "glx";
vsync = true;
glx-no-stencil = true;
use-damage = false;

# =========================
# Window Appearance
# =========================
corner-radius = 12;

active-opacity = 0.97;
inactive-opacity = 0.9;
inactive-dim = 0.05;
inactive-dim-fixed = true;

# =========================
# Blur Settings
# =========================
blur-method = "dual_kawase";
blur-strength = 4;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3lock'"
];

# Force full opacity for certain windows
opacity-rule = [
  "100:class_g = 'i3lock'"
];

# =========================
# Shadows
# =========================
shadow = false;
