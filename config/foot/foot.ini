# foot config — ubuntu-i3-setup (niri session, $mod+Return).
# Wayland-native terminal: no scrollbar, fast, minimal.
# Deployed to ~/.config/foot/foot.ini by install.sh.
[main]
font=Inter Nerd Font:size=11
pad=8x8
initial-window-size-pixels=900x600

[scrollback]
lines=10000

[colors]
background=1f1f1f
foreground=ffffff
regular0=1f1f1f
regular7=c5c8c6
bright0=707880
bright7=ffffff
selection-foreground=1f1f1f
selection-background=c5c8c6

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes
