# foot config — linux-setup (niri session, $mod+Return).
# Retrowave theme: dark-blue background, DroidSansM Nerd Font Mono 12.
# Deployed to ~/.config/foot/foot.ini by install.sh.
[main]
font=DroidSansM Nerd Font Mono:size=12
pad=8x8
initial-window-size-pixels=900x600

[scrollback]
lines=10000

[colors]
# background rgb(1,11,23), white foreground.
background=010B17
foreground=ffffff
selection-foreground=000000
selection-background=0000ff
# Retrowave palette (regular + bright rows).
regular0=262F34
regular1=EA047A
regular2=2FEFA9
regular3=DEA638
regular4=0772E9
regular5=9A6DED
regular6=11DAE4
regular7=E1E2E6
bright0=465159
bright1=EE3191
bright2=23C185
bright3=E7BF01
bright4=2A7BDE
bright5=E625E4
bright6=35EAE4
bright7=E8EAED

[cursor]
style=beam
blink=no
color=010B17 E1E2E6

[mouse]
hide-when-typing=yes
