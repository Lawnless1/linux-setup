# foot config — ubuntu-i3-setup (niri session, $mod+Return).
# Theme mirrors config/i3/config: DroidSansM Nerd Font Mono + the i3/polybar
# palette (black/blue/pastel-cyan/purple/grays). Deployed to
# ~/.config/foot/foot.ini by install.sh.
[main]
font=DroidSansM Nerd Font Mono:size=10
pad=8x8
initial-window-size-pixels=900x600

[scrollback]
lines=10000

[colors]
# i3 client.focused bg / client.unfocused: black terminal background,
# polybar #FFFFFF foreground.
background=000000
foreground=ffffff
# i3-nagbar-style selection: i3 focused blue with black text.
selection-foreground=000000
selection-background=0000ff
# 16-color palette from the i3 + polybar theme:
# black #000000, alert-red #A54242, secondary-teal #8ABEB7,
# primary-gray #C5C8C6, focused-blue #0000FF, indicator-lilac #CDA4FF,
# border-cyan #9BF6FF, disabled-gray #707880.
regular0=000000
regular1=A54242
regular2=8ABEB7
regular3=C5C8C6
regular4=0000FF
regular5=CDA4FF
regular6=9BF6FF
regular7=C5C8C6
bright0=707880
bright1=A54242
bright2=8ABEB7
bright3=C5C8C6
bright4=0000FF
bright5=CDA4FF
bright6=9BF6FF
bright7=ffffff

[cursor]
style=beam
blink=no
color=000000 9BF6FF

[mouse]
hide-when-typing=yes
