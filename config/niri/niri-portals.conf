# xdg-desktop-portal config for the niri session.
# GNOME portals back Screencast/Screenshot (screen sharing, grim/slurp,
# OBS); GTK portal is the default for everything else.
# Deployed to ~/.config/xdg-desktop-portal/niri-portals.conf by install.sh.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
