
[colors]
background = #a91f1f1f
background-alt = #373b41
foreground = #FFFFFF
primary = #C5C8C6
secondary = #8ABEB7
alert = #A54242
disabled = #707880

;==========================================================
;   SHARED SETTINGS (Base)
;==========================================================

[bar/base]
height = 24pt
radius = 10

offset-y = 0
border-size = 2pt
border-color = #00000000
pseudo-transparency = false
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
font-0 = "Inter Nerd Font:size=11;2"
font-1 = "Inter Nerd Font:size=12;3"
font-2 = "Inter Nerd Font:size=18;3"
font-3 = "Fira Code Nerd Font Mono:size=20;3"
font-4 = Weather Icons:size=10;2

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

;==========================================================
;   CENTER BAR (single bar; tray lives inside modules-right)
;==========================================================
[bar/center]
inherit = bar/base
width = 100%
override-redirect = false
modules-left = xworkspaces cpu memory
modules-right = openweathermap-simple bluetooth wifi sound battery tray popup-powermenu
modules-center = date
module-margin = 1

[module/xworkspaces]
type = internal/xworkspaces

icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9
icon-default = ""

label-active = %icon%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.background-alt}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/memory]
type = internal/memory
interval = 10
format-font = 1
format-prefix = " "
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 10
format-font = 1
label-font = 1
format-prefix = " "
label = %percentage:2%%

[module/date]
type = internal/date
interval = 10

date = %d - %I:%M %p
date-alt = %A, %d %b %Y, %H:%M %p

label =  %date%
label-foreground = ${colors.primary}
click-left = ~/.config/polybar/custom/scripts/rofi-calendar-menu.sh

[module/wifi]
type = custom/script
exec = ~/.config/polybar/custom/scripts/wifi.sh
click-left = ~/.config/polybar/custom/scripts/rofi-wifi-menu.sh
interval = 5

[module/bluetooth]
type = custom/text
label = ""
click-left = ~/.config/polybar/custom/scripts/rofi-bluetooth-menu.sh

[module/sound]
type = custom/script
format-font = 1
exec = ~/.config/polybar/custom/scripts/sound.sh
click-left = ~/.config/polybar/custom/scripts/rofi-mixer-menu.sh
scroll-up =  ~/.config/polybar/custom/scripts/sound.sh up
scroll-down = ~/.config/polybar/custom/scripts/sound.sh down
interval = 1

[module/battery]
type = custom/script
exec = ~/.config/polybar/custom/scripts/battery.sh
click-left = ~/.config/polybar/custom/scripts/rofi-battery-menu.sh
interval = 5

[module/openweathermap-simple]
type = custom/script
exec = ~/.config/polybar/custom/scripts/openweathermap-simple.sh
click-left = ~/.config/polybar/custom/scripts/rofi-weather-menu.sh
label-font = 5
interval = 600

[module/tray]
type = internal/tray
format-margin = 8px
tray-spacing = 8px

[module/popup-powermenu]
type = custom/script
exec = ~/.config/polybar/custom/scripts/popup-powermenu.sh
interval = 300
click-left = ~/.config/polybar/custom/scripts/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
