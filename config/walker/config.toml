# Walker config — linux-setup (niri session, Super+Space).
# Adapted from walker v2.17.0 resources/config.toml: unified Spotlight
# (apps always, files always — no prefix needed), pill theme.
# Deployed to ~/.config/walker/config.toml.
force_keyboard_focus = false
close_when_open = true
click_to_close = true
as_window = false
single_click_activation = true
selection_wrap = false
global_argument_delimiter = "#"    # query: firefox#https://benz.dev => part after delimiter will be ignored when querying. this should be the same as in the elephant config
exact_search_prefix = "'"
theme = "pill"                     # themes/pill/style.css (dark-navy, matches bar)
disable_mouse = false
debug = false
page_jump_items = 10
hide_quick_activation = true
hide_action_hints = false
hide_action_hints_dmenu = true
hide_return_action = false
keybind_symbols = true             # render keybind hints with key symbols (e.g. ⌃+⏎) instead of plain text ("ctrl Return")
resume_last_query = false
actions_as_menu = false
autoplay_videos = false
ext_background_effect_blur = true  # request the compositor to blur behind the box-wrapper via ext-background-effect-v1 (niri >= 26.04; needs semi-transparent theme bg to be visible)

[shell]
exclusive_zone = -1
layer = "overlay"
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[columns]
"symbols" = 3

[placeholders]
"default" = { input = "Search for anything...", list = "No Results" } # placeholders for input and empty list, key is the providers name, so f.e. "desktopapplications" or "menus:other"
"clipboard" = { input = "Clipboard history", list = "Nothing copied yet" }

[keybinds]
close = ["Escape"]
next = ["Down"]
previous = ["Up"]
left = ["Left"]
right = ["Right"]
down = ["Down"]
up = ["Up"]
toggle_exact = ["ctrl e"]
resume_last_query = ["ctrl r"]
quick_activate = ["F1", "F2", "F3", "F4"]
page_down = ["Page_Down"]
page_up = ["Page_Up"]
show_actions = ["alt j"]

[providers]
default = [
  "desktopapplications",
  "files",
] # providers to be queried by default (order = rank priority)
empty = ["desktopapplications"]
ignore_preview = ["clipboard"] # side preview panel would widen the fixed 480px
# clipboard popup on every image entry; files/desktopapplications previews
# in the pill omnibar are unaffected (pill only sees this provider via ":")
max_results = 15 # global max results (compact pill list)

[providers.argument_delimiter] # define the argument delimiter per provider

[providers.sets] # define your own defaults/empty sets of providers
[providers.max_results_provider] # define max results per provider in here
clipboard = 8 # short minimal popup; scrolls past 8

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "!"
provider = "todo"

[[providers.prefixes]]
prefix = "%"
provider = "bookmarks"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "$"
provider = "windows"

[providers.clipboard]
time_format = "relative"

[providers.actions] # This will be MERGED/OVERWRITTEN with what the user specifies
fallback = [
  { action = "menus:open", label = "open", after = "Nothing" },
  { action = "menus:default", label = "run", after = "Close" },
  { action = "menus:parent", label = "back", bind = "Escape", after = "Nothing" },
  { action = "erase_history", label = "clear hist", bind = "ctrl h", after = "AsyncReload" },
]

dmenu = [{ action = "select", default = true, bind = "Return" }]

