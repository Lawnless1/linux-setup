# Fuzzel config — ubuntu-i3-setup (niri session).
# Spotlight-like omnibar behind $mod+d / $mod+space (and the Ctrl+Alt+Delete
# power menu in dmenu mode). Empty state is a bare input pill; the result
# list unfolds beneath it once you type (hide-before-typing).
# Dark-navy pill matching waybar/dunst (#010B17, text #E1E2E6, 1px
# muted-grey frame #C5C8C6). Requires fuzzel >= 1.12 (see
# scripts/build-fuzzel.sh — noble ships 1.9.2, which lacks these keys).
# Deployed to ~/.config/fuzzel/fuzzel.ini.
[main]
font=Inter Nerd Font:size=12
# Spotlight geometry: ~600px wide, floats below the bar.
# Pill behavior comes from scripts/fuzzel-pill.patch (source build): the
# window is just the prompt row when empty and grows to `lines` rows while
# searching — so this can stay a generous 8 without fattening the pill.
anchor=top
y-margin=150
lines=8
width=55
horizontal-pad=24
vertical-pad=12
inner-pad=8
line-height=30px
# Bare pill until first keystroke; counter at the prompt's right edge.
hide-before-typing=yes
match-counter=yes
placeholder=Search
use-bold=yes
prompt="❯ "
icons-enabled=yes
icon-theme=Adwaita
# True omnibar: desktop apps AND any executable on PATH, matched broadly.
list-executables-in-path=yes
fields=filename,name,generic,keywords,categories,comment
show-actions=no
# foot is the niri terminal ($mod+Return); used for Terminal=true apps.
terminal=foot -e
# Render above fullscreen video so Super+Space always answers.
layer=overlay

[colors]
background=010b17ee
text=e1e2e6ff
prompt=c5c8c6ff
input=e1e2e6ff
placeholder=707880ff
match=9bf6ffff
selection=1e2e44ff
selection-text=ffffffff
selection-match=9bf6ffff
counter=707880ff
border=c5c8c6ff

[border]
width=1
radius=16

[dmenu]
mode=text
