# Fuzzel config — ubuntu-i3-setup (niri session).
# Mac-like omnibar behind $mod+d / $mod+space (and the Ctrl+Alt+Delete
# power menu in dmenu mode). Dark-navy pill matching waybar/dunst
# (#010B17, light-grey text #E1E2E6, 1px muted-grey frame #C5C8C6).
# Deployed to ~/.config/fuzzel/fuzzel.ini.
[main]
font=Inter Nerd Font:size=11
# Spotlight-sized: ~600px wide, 6 roomy rows (minimal, not a wall of apps).
lines=6
width=55
horizontal-pad=24
vertical-pad=16
inner-pad=12
line-height=28px
# Minimal chevron prompt (same one as the markstos theme in the 1.11 tour).
prompt="❯ "
icons-enabled=yes
icon-theme=Adwaita
# Omnibar matching: name + keywords + categories + comment, not just filename.
fields=filename,name,generic,keywords,categories,comment
show-actions=no
# foot is the niri terminal ($mod+Return); used for Terminal=true apps.
terminal=foot -e
# Render above fullscreen video so Super+Space always answers.
layer=overlay

[colors]
background=010b17ee
text=e1e2e6ff
match=9bf6ffff
selection=1e2e44ff
selection-text=ffffffff
selection-match=9bf6ffff
border=c5c8c6ff

[border]
width=1
radius=16

[dmenu]
mode=text
