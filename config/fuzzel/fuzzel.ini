# Fuzzel config — ubuntu-i3-setup (niri session).
# Wayland-native dmenu-style launcher behind $mod+d / $mod+space and the
# Ctrl+Alt+Delete power menu. Deployed to ~/.config/fuzzel/fuzzel.ini.
[main]
font=Inter Nerd Font:size=11
lines=12
width=45
horizontal-pad=12
vertical-pad=8
inner-pad=4
prompt="run: "
show-actions=no

[colors]
background=1f1f1fee
text=ffffffff
prompt=8abeb7ff
placeholder=707880ff
input=ffffffff
match=8abeb7ff
selection=c5c8c6ff
selection-text=1f1f1fff
selection-match=1f1f1fff
counter=707880ff
border=c5c8c6ff

[border]
width=2
radius=8
