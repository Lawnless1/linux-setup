# Fuzzel config for --dmenu menus (bluetooth picker, power menu).
# Same dark-navy pill theme as fuzzel.ini, but with
# hide-before-typing=no so options are visible immediately — the
# omnibar's hide-before-typing=yes would otherwise open these menus
# as an empty input box until the first keystroke.
# Deployed to ~/.config/fuzzel/fuzzel-dmenu.ini (see install.sh).
[main]
font=Inter Nerd Font:size=12
anchor=top
y-margin=150
lines=12
width=55
horizontal-pad=24
vertical-pad=12
inner-pad=8
line-height=30px
hide-before-typing=no
match-counter=yes
placeholder=Search
use-bold=yes
prompt="❯ "
icons-enabled=yes
icon-theme=Adwaita
# Render above fullscreen video like the omnibar.
layer=overlay

[colors]
background=010b17ee
text=e1e2e6ff
prompt=c5c8c6ff
input=e1e2e6ff
placeholder=707880ff
match=9bf6ffff
selection=1e2e44ff
selection-text=ffffffff
selection-match=9bf6ffff
counter=707880ff
border=c5c8c6ff

[border]
width=1
radius=16

[dmenu]
mode=text
